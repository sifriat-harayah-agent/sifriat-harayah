name: Publish signed Android release
on:
  push:
    paths:
      - 'release496.part*'
      - '.github/workflows/release496.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified signed APK
        run: |
          cat release496.part01 release496.part02 > sifriat-harayah-0.4.96.apk
          echo '1b62b8544575a9cfd3426568d4a820eba515548791b723435e74e1feff8ab4a0  sifriat-harayah-0.4.96.apk' | sha256sum -c -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.4.96 || gh release create v0.4.96 --title 'ספריית הראי״ה 0.4.96' --notes 'להתקנה או לעדכון, הורידו את קובץ ה-APK המצורף. אין להסיר את הגרסה הקודמת לפני העדכון.'
          gh release edit v0.4.96 --title 'ספריית הראי״ה 0.4.100' --notes 'מפתח נושאים היררכי, חיפוש בכותרות ונתיבים, תפריט מעודכן וקישור שיתוף קבוע. הקובץ המצורף הוא גרסה 0.4.100, קוד 130. שם הקובץ נשמר כדי שקישורי ההורדה הקיימים ימשיכו לפעול. מתקינים מעל הגרסה הקיימת, ללא הסרה.'
          gh release upload v0.4.96 sifriat-harayah-0.4.96.apk --clobber
          cp sifriat-harayah-0.4.96.apk sifriat-harayah-latest.apk
          gh release upload v0.4.96 sifriat-harayah-latest.apk --clobber
          cp sifriat-harayah-0.4.96.apk sifriat-harayah.apk
          gh release upload v0.4.96 sifriat-harayah.apk --clobber
